# The root package is also the workspace root. `src/` deliberately does not move into
# `crates/`: the wiki cites `src/<file>.rs:<line>` in hundreds of places and those citations are
# load-bearing. The trial crates are workspace members deliberately: the verification script names
# each package gate explicitly, so examples cannot drift out of the checked graph by accident.
[workspace]
members = [
    "crates/frontbox-dioxus",
    "crates/frontbox-indexeddb",
    "crates/frontbox-sqlite",
    "examples/todo-app",
    "examples/todo-core",
    "examples/todo-server",
    "examples/user-server",
]
resolver = "2"

[package]
name = "frontbox"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"           # The locked dependency graph currently requires Rust 1.88.
description = "Offline-first cache and mutation outbox for Rust frontends"
repository = "https://github.com/nicolasmartino/frontbox"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["offline-first", "outbox", "sync", "cache", "wasm"]
categories = ["caching", "database", "wasm"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Core never generates a `MutationId` — the caller supplies it, which is what makes
# application-owned direct dispatch expressible. Generation therefore lives behind the
# `v4` feature rather than in the base dependency.
#
# It stays *on* by default, deliberately: a caller with no identifier of its own would
# otherwise have to depend on `uuid` directly to make one, which trades a transitive
# dependency for an explicit one and helps nobody. The cost is a randomness backend,
# and `--no-default-features` removes it — a gate in `scripts/verify.sh` builds that
# configuration for wasm so the randomness-free path cannot rot.
uuid = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
pollster = "0.4"
# Doctests compile as external crates, so these need to be reachable there too.
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# A test oracle, not a dependency (decision 011). `src/rfc3339.rs` renders `client_datetime`
# itself; chrono is kept here so `src/rfc3339/tests.rs` can assert those bytes are chrono's,
# which is what lets the wire format stay byte-compatible without chrono in the semver contract.
#
# `default-features = false` still drops the `clock` feature, so `Utc::now()` does not compile
# even in tests. Time enters only through `Clock` (decision 002) everywhere, not just in `src`.
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }

[features]
default = ["v4"]
# Random `MutationId` generation. See the note on the `uuid` dependency above.
v4 = ["uuid/v4", "uuid/js"]
# The backend-agnostic conformance suite. Off by default so test scaffolding is not
# compiled into applications; the durable backends will turn it on to run the suite.
testing = []

[package.metadata.docs.rs]
all-features = true
