[package]
name = "frontbox-indexeddb"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Durable IndexedDB persistence for frontbox, on web targets"

[dependencies]
frontbox = { path = "../.." }
# `web-sys` directly rather than a wrapper such as `rexie`, which is what the source system used.
# The reason is transaction lifetime: an IndexedDB transaction goes inactive the moment control
# returns to the event loop, so `merge_rows` — which must read the queue and write the rows as one
# unit — needs exact control over when each request is issued. A wrapper that decides that for us
# is a wrapper that can silently break atomicity.
web-sys = { version = "0.3", features = [
    "DomException",
    # `IdbDatabase::object_store_names`, which is how an upgrade tells a store it must create from
    # one an earlier version already made. Cheaper than catching `ConstraintError`, and honest:
    # an ignored throw cannot be told from a creation that failed for a reason that mattered.
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbIndex",
    "IdbIndexParameters",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Window",
    "WorkerGlobalScope",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Mirrors core: the conformance factory is not compiled into applications.
testing = ["frontbox/testing"]

[dev-dependencies]
frontbox = { path = "../..", features = ["testing"] }
wasm-bindgen-test = "0.3"
