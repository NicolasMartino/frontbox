server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate rather than cache, because **`dx` does not content-hash its output**. The bundle
    # ships as `wasm/todo-app.js` and `wasm/todo-app_bg.wasm` — stable names across every build — so
    # the usual `immutable` / one-year rule for a hashed asset would be exactly wrong here: a
    # redeploy would leave every returning visitor on the previous bundle with nothing to invalidate
    # it. `no-cache` does not mean "do not store"; it means store it and revalidate, which nginx
    # answers with a 304 from the ETag when nothing changed. The 2 MB release wasm is re-sent only
    # when it actually differs.
    location ~ \.(wasm|js)$ {
        add_header Cache-Control "no-cache";
    }
}
