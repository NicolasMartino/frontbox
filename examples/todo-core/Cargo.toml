[package]
name = "todo-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "The framework-neutral application half of the D4a offline todo trial"
license = "MIT OR Apache-2.0"
publish = false

# **No Dioxus here, deliberately.** If the application logic needs the adapter, the adapter is
# leaking; keeping this crate framework-free is what makes that falsifiable. It is also what lets
# the trial's observations run as ordinary tests instead of as "start it and look".
[dependencies]
frontbox = { path = "../.." }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# **The storage seam, and the whole of what D4b changes here.** The backend is chosen per target
# because that is the only thing that genuinely differs: SQLite where there is a filesystem,
# IndexedDB where there is a browser. Everything above this line is identical on both.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
frontbox-sqlite = { path = "../../crates/frontbox-sqlite" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
frontbox-indexeddb = { path = "../../crates/frontbox-indexeddb" }
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "net"] }
todo-server = { path = "../todo-server" }
user-server = { path = "../user-server" }
