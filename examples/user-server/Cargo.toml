[package]
name = "user-server"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "The second domain server of the D4d multi-domain trial"
license = "MIT OR Apache-2.0"
publish = false

# **This crate deliberately does not depend on `frontbox`**, for the reason
# `examples/todo-server/Cargo.toml` gives: a server that shares the client's types cannot disagree
# with them, and the trial's tests are the oracle for whether the wire format is implementable.
#
# **It does not depend on `todo-server` either**, and that is the same argument one level up. The
# two servers are two independent readings of one protocol; sharing `wire.rs` between them would
# make the second implementation free and worthless. The duplication in
# `examples/user-server/src/wire.rs` is the point — see that file's header.
[dependencies]
axum = "0.8"
# The delete cascade (`examples/user-server/src/todos.rs`), which calls the todo service. A fixture
# rather than a recommendation, and the file says why at length.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
